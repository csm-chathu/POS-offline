name: Release Offline Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pos-client deps and build
        working-directory: pos-client
        run: |
          npm install
          npm run build
        env:
          VITE_API_URL: http://localhost:8000

      - name: Copy React build to pos-api/public
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force pos-api/public -ErrorAction SilentlyContinue
          Copy-Item -Recurse pos-client/dist pos-api/public

      - name: Install pos-api deps (compiled for Electron runtime)
        working-directory: pos-api
        env:
          npm_config_target: "31.7.7"
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_build_from_source: "true"
        run: npm install

      - name: Install electron deps
        working-directory: electron
        run: npm install

      - name: Build & publish offline EXE
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.offline.config.js --win nsis --publish always
